<!DOCTYPE html>
<html>

<head>
    <title>Music Player</title>
    <link rel="stylesheet" href="music-style.css">
</head>

<body>

    <main class="player">

        <div class="top-bar">
            <span>NOW PLAYING</span>
            <span>•••</span>
        </div>


        <div class="album">
            <div class="album-art">
                <div class="circle"></div>
            </div>
        </div>


        <div class="song-info">
            <p class="label">FEATURED TRACK</p>

            <h1>Midnight Thoughts</h1>

            <p class="artist">A Quiet Evening</p>
        </div>


        <div class="progress-section">

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <div class="time">
                <span>1:42</span>
                <span>3:48</span>
            </div>

        </div>


        <div class="controls">

            <button>↶</button>

            <button class="previous">◀</button>

            <button class="play">▶</button>

            <button class="next">▶</button>

            <button>↷</button>

        </div>


        <div class="bottom-info">

            <div>
                <span>Volume</span>
                <strong>80%</strong>
            </div>

            <div>
                <span>Playlist</span>
                <strong>12 Songs</strong>
            </div>

        </div>

    </main>

</body>

</html>
