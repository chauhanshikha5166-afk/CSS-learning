
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="task-manager.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>My Tasks</h1>
            <p>Plan your work and complete it on time.</p>
        </header>

        <section class="task-list">
            <h2>Today's Tasks</h2>

            <label class="task">
                <input type="checkbox">
                <span>Revise CSS notes</span>
                <small class="high">High</small>
            </label>

            <label class="task">
                <input type="checkbox">
                <span>Complete college assignment</span>
                <small class="medium">Medium</small>
            </label>

            <label class="task">
                <input type="checkbox">
                <span>Practice coding for 30 minutes</span>
                <small class="high">High</small>
            </label>

            <label class="task">
                <input type="checkbox">
                <span>Read one chapter</span>
                <small class="low">Low</small>
            </label>
        </section>

        <section class="note">
            <h2>Reminder</h2>
            <p>Focus on one task at a time. Consistency matters!</p>
        </section>

        <footer>
            Day 21 CSS Practice
        </footer>

    </div>

</body>
</html>
